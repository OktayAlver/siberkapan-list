name: Update Blocklists

on:
  schedule:
    - cron: '15 */6 * * *'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch lists
        run: |
          mkdir -p lists
          curl -sf "https://siberkapan.org/api/v1/view/fortigate-feed" -o lists/fortigate-feed.txt
          curl -sf "https://siberkapan.org/api/v1/view/honeypot-feed"  -o lists/honeypot-feed.txt
          curl -sf "https://siberkapan.org/api/v1/view/nginx-feed"     -o lists/nginx-feed.txt
          curl -sf "https://siberkapan.org/api/v1/view/all-feed"       -o lists/all-feed.txt
          curl -sf "https://siberkapan.org/api/v1/view/txt?min_score=75" -o lists/high-confidence.txt
          curl -sf "https://siberkapan.org/api/v1/export/suricata"     -o lists/suricata.rules
          curl -sf "https://siberkapan.org/api/v1/export/wazuh-cdb"    -o lists/wazuh-cdb.txt
          curl -sf "https://siberkapan.org/domains/siberkapan/strict/domains.txt" -o lists/phishing-strict-domains.txt
          curl -sf "https://siberkapan.org/domains/siberkapan/strict/adblock.txt" -o lists/phishing-strict-adblock.txt
          curl -sf "https://siberkapan.org/domains/siberkapan/strict/hosts.txt"   -o lists/phishing-strict-hosts.txt
          curl -sf "https://siberkapan.org/api/v1/list/cidr24" -o lists/cidr24.txt
          curl -sf "https://siberkapan.org/api/v1/kev.json" -o lists/kev-bcp07.json
          curl -sf "https://siberkapan.org/top-passwords.json" -o lists/top-passwords.json

      - name: Sanity check strict lists
        run: |
          for f in lists/phishing-strict-*.txt; do
            n=$(grep -vc '^[!#]' "$f" || true)
            echo "$f: $n kayit"
            if [ "$n" -lt 50 ]; then echo "UYARI: $f beklenenden kucuk, commit edilmeyecek"; git checkout -- "$f" 2>/dev/null || rm -f "$f"; fi
          done

      - name: Commit if changed
        run: |
          git config user.name "siberkapan-bot"
          git config user.email "bot@siberkapan.org"
          git add lists/
          if ! git diff --cached --quiet; then
            git commit -m "chore: auto-update blocklists $(date -u +'%Y-%m-%d %H:%M UTC')"
            git push
          else
            echo "No changes."
          fi
